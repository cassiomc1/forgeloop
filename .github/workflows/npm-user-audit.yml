name: Published npm new-user SQLite audit
on:
  push:
    branches: [codex/npm-user-audit-20261014, codex/npm-sqlite-recovery-fixes-20261014, codex/rc4-windows-release-20261014]
  workflow_dispatch:
    inputs:
      package_source:
        description: Package to test
        type: choice
        options: [candidate, npm, latest]
        default: candidate
      version:
        description: Exact expected package version
        type: string
        default: 2.0.0-rc.4
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: npm SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PACKAGE_SOURCE: ${{ inputs.package_source || 'candidate' }}
      FORGELOOP_AUDIT_VERSION: ${{ inputs.version || '2.0.0-rc.4' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: Linux, runner: [self-hosted, Linux, X64, forgeloop-linux-remote] }
          - { os: macOS, runner: [self-hosted, macOS, ARM64, forgeloop-macos-local] }
          - { os: Windows, runner: [self-hosted, Windows, X64, forgeloop-windows-remote] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Verify restore provenance and release-policy regressions
        shell: bash
        run: |
          npm ci --ignore-scripts
          node --import=./scripts/test-semantic-provider-loader.mjs --test tests/storage-restore-execution-provenance.test.js tests/storage-restore-command.test.js tests/rc-release-policy.test.js
      - name: Install published npm artifact and test fresh user project
        if: runner.os != 'Windows'
        shell: bash
        env:
          TYPESAFE_API_KEY: ${{ secrets.FORGELOOP_NPM_AUDIT_JEV_KEY }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-user-${{ github.run_id }}-${{ github.run_attempt }}/cache
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-user-${{ github.run_id }}-${{ github.run_attempt }}/empty.npmrc
        run: |
          mkdir -p "$RUNNER_TEMP/npm-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ "$PACKAGE_SOURCE" = latest ]; then
            package_spec="@cassiomc1/forgeloop"
            npm view "$package_spec" version dist.integrity --json
          elif [ "$PACKAGE_SOURCE" = npm ]; then
            npm view "@cassiomc1/forgeloop@$FORGELOOP_AUDIT_VERSION" dist.integrity --json
            package_spec="@cassiomc1/forgeloop@$FORGELOOP_AUDIT_VERSION"
          else
            npm pack --pack-destination "$RUNNER_TEMP/npm-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            package_spec="$RUNNER_TEMP/npm-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/cassiomc1-forgeloop-$FORGELOOP_AUDIT_VERSION.tgz"
          fi
          npm install --prefix "$RUNNER_TEMP/npm-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/install" --no-audit --no-fund "$package_spec"
          node scripts/npm-user-audit.mjs "$RUNNER_TEMP/npm-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/install" "$RUNNER_TEMP/npm-user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/results"
      - name: Install and test using native Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TYPESAFE_API_KEY: ${{ secrets.FORGELOOP_NPM_AUDIT_JEV_KEY }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-user-${{ github.run_id }}-${{ github.run_attempt }}/cache
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-user-${{ github.run_id }}-${{ github.run_attempt }}/empty.npmrc
        run: |
          $ErrorActionPreference = 'Stop'
          $auditRoot = Join-Path $env:RUNNER_TEMP "npm-user-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $installRoot = Join-Path $auditRoot 'install'
          $resultRoot = Join-Path $auditRoot 'results'
          New-Item -ItemType Directory -Force $auditRoot | Out-Null
          if ($env:PACKAGE_SOURCE -eq 'latest') {
            $packageSpec = '@cassiomc1/forgeloop'
            npm view $packageSpec version dist.integrity --json
            if ($LASTEXITCODE -ne 0) { throw 'npm latest lookup failed' }
          } elseif ($env:PACKAGE_SOURCE -eq 'npm') {
            $packageSpec = "@cassiomc1/forgeloop@$env:FORGELOOP_AUDIT_VERSION"
            npm view $packageSpec dist.integrity --json
          } else {
            npm pack --pack-destination $auditRoot
            if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
            $packageSpec = Join-Path $auditRoot "cassiomc1-forgeloop-$env:FORGELOOP_AUDIT_VERSION.tgz"
          }
          npm install --prefix $installRoot --no-audit --no-fund $packageSpec
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          node scripts/npm-user-audit.mjs $installRoot $resultRoot
          exit $LASTEXITCODE
      - name: Upload observed results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-user-audit-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-user-${{ github.run_id }}-${{ github.run_attempt }}/results/report.json
          if-no-files-found: error
