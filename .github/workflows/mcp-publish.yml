name: Publish ForgeLoop MCP package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact MCP package version to publish"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH PRIVATE PACKAGE to authorize this manual release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH PRIVATE PACKAGE'
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integrations/mcp
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify MCP tag and package version
        env:
          EXPECTED_MCP_VERSION: ${{ inputs.version }}
        run: |
          expected="$EXPECTED_MCP_VERSION"
          actual="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$expected" = "$actual"
      - name: Install MCP release dependencies
        run: npm ci --install-links --ignore-scripts --no-audit --no-fund
      - name: Run MCP tests
        run: npm test

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH PRIVATE PACKAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/mcp
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify MCP tag and package version
        env:
          EXPECTED_MCP_VERSION: ${{ inputs.version }}
        run: |
          expected="$EXPECTED_MCP_VERSION"
          actual="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$expected" = "$actual"
      - name: Install MCP release dependencies
        run: npm ci --install-links --ignore-scripts --no-audit --no-fund
      - name: Publish with trusted publishing
        run: npm publish --provenance --access restricted
