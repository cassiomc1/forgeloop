name: Docs quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts

      - name: Verify ForgeLoop PoC evidence package
        run: npm run poc:evidence:verify

      - name: Test ForgeLoop PoC evidence verifier
        run: npm run poc:evidence:test

      - name: Enforce dependency policy
        run: npm run dependency:policy

      - name: Lint JavaScript
        run: npm run lint

      - name: Enforce complexity ratchet
        run: npm run complexity:check

      - name: Measure test coverage
        if: matrix.node-version == 24
        run: npm run coverage

      - name: Enforce critical-module coverage
        if: matrix.node-version == 24
        run: npm run critical-coverage:check

      - name: Verify generated Markdown freshness
        run: npm run docs:generated:check

      - name: Verify generated protocol assistance
        run: |
          npm run completions:check
          npm run summary:check
          npm run changelog:check
        if: matrix.node-version == 24

      - name: Report efficiency regression status
        run: npm run benchmark:profiles:regression -- --json
        if: matrix.node-version == 24

      - name: Check CLI startup budget
        run: npm run performance:check
        if: matrix.node-version == 24

      - name: Validate documentation semantics
        run: npm run docs:conformance

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            --no-globs
            **/*.{md,markdown}
            #vendor/archify/**

      - name: Check links
        # Link checking is independent of the Node matrix; avoid three
        # simultaneous requests to rate-limited reference hosts.
        if: matrix.node-version == 24
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml
            --verbose
            --no-progress
            --exclude-path '(^|/)node_modules(/|$)'
            --exclude-path '(^|/)coverage(/|$)'
            --exclude-path '(^|/)\.worktrees(/|$)'
            --exclude-path '(^|/)\.superpowers(/|$)'
            --exclude-path '(^|/)docs/superpowers(/|$)'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Markdown
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ is required"'
          python3 -m unittest tests.test_validate_markdown -v
          python3 scripts/validate_markdown.py --self-test
          python3 scripts/validate_markdown.py
      - name: Validate universal project loop
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ is required"'
          python3 -m unittest tests.test_validate_loop_system -v
          python3 scripts/validate_loop_system.py --self-test
          python3 scripts/validate_loop_system.py

      - name: Scan repository for secrets
        run: python3 -m unittest tests.test_scan_secrets -v && python3 scripts/scan_secrets.py

  cli-portability:
    name: CLI portability (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 20 }
          - { os: ubuntu-latest, node-version: 22 }
          - { os: macos-latest, node-version: 20 }
          - { os: macos-latest, node-version: 24 }
          - { os: windows-latest, node-version: 20 }
          - { os: windows-latest, node-version: 24 }
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts

      - name: Enforce dependency policy
        run: npm run dependency:policy

      - name: Test npm CLI and portability fixtures
        run: npm test

  required-validation:
    # Retain the branch ruleset's historical context without duplicating suites.
    name: validate (22)
    needs: [validate, cli-portability, docs-diagram]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: >-
          node -e 'const results = JSON.parse(process.env.REQUIRED_RESULTS); for (const name of ["validate", "cli-portability", "docs-diagram"]) { if (results[name]?.result !== "success") throw new Error(`${name} did not succeed`); }'

  docs-diagram:
    name: Verify generated Archify diagram
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts

      - name: Verify pinned Archify workflow and generated artifacts
        run: npm run docs:diagrams:check

      - name: Verify documentation inventory and conformance
        run: npm run docs:check
