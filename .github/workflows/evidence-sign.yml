name: Evidence signing

# Signs a committed ForgeLoop evidence bundle with this repository's GitHub
# Actions OIDC identity. The signature certifies that this workflow, running
# from main, verified the evidence against the commit that introduced it; it
# does not prove that ForgeLoop produced the bundle. Manual dispatch only while
# the hosted check learns to verify detached signatures.

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task ID of a committed evidence bundle in .forgeloop-evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: evidence-signing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Verify and sign evidence
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TASK_ID: ${{ inputs.task }}
    steps:
      - name: Check out main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked toolchain
        run: npm ci --ignore-scripts
      - name: Verify the evidence against the commit that introduced it
        run: |
          set -euo pipefail
          if ! printf '%s' "$TASK_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$'; then
            echo "Invalid task ID" >&2
            exit 1
          fi
          bundle=".forgeloop-evidence/${TASK_ID}.json"
          test -f "$bundle"
          added=$(git log --diff-filter=A --format=%H -1 -- "$bundle")
          test -n "$added"
          echo "Bundle added in $added"
          node src/cli.js evidence-verify --base "${added}^1" --head "$added" --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("node:fs");
            const bundle = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (bundle.taskId !== process.argv[2]) throw new Error("Bundle task ID does not match the input");
            fs.writeFileSync("statement.json", bundle.statement.text);
          ' "$bundle" "$TASK_ID"
          sha256sum statement.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the statement with the core provider arguments
        run: cosign attest-blob --statement statement.json --bundle statement.sigstore.json --yes
      - name: Verify the signature against this workflow identity
        run: |
          set -euo pipefail
          cosign verify-blob-attestation \
            --statement statement.json \
            --bundle statement.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/evidence-sign.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          node -e '
            const bundle = JSON.parse(require("node:fs").readFileSync("statement.sigstore.json", "utf8"));
            console.log(`mediaType: ${bundle.mediaType ?? "(none)"}`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the statement and signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-signature-${{ inputs.task }}
          path: |
            statement.json
            statement.sigstore.json
          if-no-files-found: error
          retention-days: 30
