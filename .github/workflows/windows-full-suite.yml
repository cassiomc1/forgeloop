name: Windows full suite

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Windows validation scope
        type: choice
        options:
          - full
          - database-admission
          - storage-correction
          - process-incarnation
          - public-rollback
          - old-client
        default: full

permissions:
  contents: read

concurrency:
  group: windows-full-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rc: ${{ steps.mode.outputs.rc }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select bounded RC platform
        id: mode
        run: node -e 'const fs = require("fs"); const rc = /^2\.0\.0-rc\./.test(require("./package.json").version); fs.appendFileSync(process.env.GITHUB_OUTPUT, "rc=" + rc + "\n");'
  test:
    needs: release-mode
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.suite != 'public-rollback' }}
    name: Windows full Node suite
    runs-on: ${{ needs.release-mode.outputs.rc == 'true' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full') && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64", "forgeloop-windows-remote"]') }}
    timeout-minutes: 35
    steps:
      - name: Verify requested Windows host and Docker Linux runner identity
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requestedHost = '100.83.46.210'
          if (-not (Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -eq $requestedHost)) {
            throw 'The Windows runner is not on the requested host.'
          }
          $dockerExe = Join-Path $env:ProgramFiles 'Docker\Docker\resources\bin\docker.exe'
          $identity = & $dockerExe --config 'C:\forgeloop-ci\docker-config' --host 'npipe:////./pipe/dockerDesktopLinuxEngine' inspect forgeloop-linux-remote --format '{{.Id}} {{.Image}} {{.State.Running}} {{.Config.Hostname}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker Linux runner inspection failed.' }
          if ($identity -notmatch '^[a-f0-9]{64} sha256:[a-f0-9]{64} true [A-Za-z0-9][A-Za-z0-9_.-]{0,252}$') { throw 'The Docker Linux runner is not running with a verifiable identity.' }
          Write-Output "Windows host: $requestedHost; computer: $env:COMPUTERNAME"
          Write-Output "Docker Linux runner: $identity"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Run full Node suite with Windows process and filesystem semantics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'full' }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -match '^2\.0\.0-rc\.') {
            git config core.autocrlf false
            git checkout-index --force --all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            @'
          import { writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          for (const file of ["LICENSE", "integrations/generic-ci/verify.sh", "integrations/mcp/LICENSE", "src/integration.d.ts"]) {
            writeFileSync(file, execFileSync("git", ["cat-file", "blob", "HEAD:" + file]));
          }
          '@ | node --input-type=module
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run release:quick
          } else {
            npm test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate instrumented storage and replacement recovery on Windows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'storage-correction' }}
        run: node --import ./scripts/test-semantic-provider-loader.mjs --test tests/storage-database-admission.test.js tests/storage-correction-io.test.js tests/storage-evidence-checks.test.js tests/storage-replacement-preparation.test.js
      - name: Validate kernel-backed Windows process incarnation observations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'process-incarnation' }}
        run: node --test tests/storage-windows-process-incarnation.test.js tests/storage-maintenance-incarnation.test.js tests/storage-maintenance-handoff-async.test.js tests/storage-maintenance-adoption-proof.test.js
      - name: Diagnose project database admission on Windows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'database-admission' }}
        run: node --test tests/storage-database-admission.test.js

  public-rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'public-rollback' || inputs.suite == 'old-client') }}
    name: ${{ inputs.suite == 'old-client' && 'Old-client exclusion' || 'Public rollback' }} (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: [self-hosted, Linux, X64, forgeloop-linux-remote] }
          - { os: Windows, runner: [self-hosted, Windows, X64, forgeloop-windows-remote] }
    defaults:
      run:
        working-directory: current
    steps:
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned legacy validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ee9ce11123d4e728d3dbc92f5d62d4bf41bb79c5
          path: legacy
          persist-credentials: false
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            current/package-lock.json
            legacy/package-lock.json
      - name: Install locked current toolchain
        run: npm ci --ignore-scripts
      - name: Install locked legacy validator dependencies
        working-directory: legacy
        run: npm ci --ignore-scripts
      - name: Run sixteen actual public CLI rollback and owner-death drills
        if: ${{ inputs.suite == 'public-rollback' }}
        run: node scripts/drill-storage-public-rollback.mjs --legacy-root=../legacy --output="${{ runner.temp }}/sqlite-public-rollback-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete drill evidence
        if: ${{ always() && inputs.suite == 'public-rollback' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-public-rollback-${{ matrix.os }}
          path: ${{ runner.temp }}/sqlite-public-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
      - name: Run old-client exclusion drill with retained evidence
        if: ${{ inputs.suite == 'old-client' }}
        run: node scripts/ci/record-old-client-exclusion-evidence.mjs --legacy-root=../legacy --output="${{ runner.temp }}/sqlite-old-client-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete old-client exclusion evidence
        if: ${{ always() && inputs.suite == 'old-client' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-old-client-${{ matrix.os }}
          path: ${{ runner.temp }}/sqlite-old-client-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
