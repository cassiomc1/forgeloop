name: Windows full suite

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Windows validation scope
        type: choice
        options:
          - full
          - database-admission
          - storage-correction
          - public-rollback
          - mcp-resources
        default: full

permissions:
  contents: read

concurrency:
  group: windows-full-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.suite != 'public-rollback' && inputs.suite != 'mcp-resources' }}
    name: Windows full Node suite
    runs-on: [self-hosted, Windows, X64, forgeloop-windows-remote]
    timeout-minutes: 35
    steps:
      - name: Verify requested Windows host and Docker Linux runner identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requestedHost = '100.83.46.210'
          if (-not (Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -eq $requestedHost)) {
            throw 'The Windows runner is not on the requested host.'
          }
          $dockerExe = Join-Path $env:ProgramFiles 'Docker\Docker\resources\bin\docker.exe'
          $identity = & $dockerExe --config 'C:\forgeloop-ci\docker-config' --host 'npipe:////./pipe/dockerDesktopLinuxEngine' inspect forgeloop-linux-remote --format '{{.Id}} {{.Image}} {{.State.Running}} {{.Config.Hostname}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker Linux runner inspection failed.' }
          if ($identity -notmatch '^[a-f0-9]{64} sha256:[a-f0-9]{64} true [A-Za-z0-9][A-Za-z0-9_.-]{0,252}$') { throw 'The Docker Linux runner is not running with a verifiable identity.' }
          Write-Output "Windows host: $requestedHost; computer: $env:COMPUTERNAME"
          Write-Output "Docker Linux runner: $identity"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Run full Node suite with Windows process and filesystem semantics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'full' }}
        run: npm test
      - name: Validate instrumented storage and replacement recovery on Windows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'storage-correction' }}
        run: node --import ./scripts/test-semantic-provider-loader.mjs --test tests/storage-database-admission.test.js tests/storage-correction-io.test.js tests/storage-evidence-checks.test.js tests/storage-replacement-preparation.test.js
      - name: Diagnose project database admission on Windows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'database-admission' }}
        run: node --test tests/storage-database-admission.test.js

  public-rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'public-rollback' }}
    name: Public rollback (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - { os: Linux, runner: [self-hosted, Linux, X64, forgeloop-linux-remote] }
          - { os: Windows, runner: [self-hosted, Windows, X64, forgeloop-windows-remote] }
    defaults:
      run:
        working-directory: current
    steps:
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned legacy validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ee9ce11123d4e728d3dbc92f5d62d4bf41bb79c5
          path: legacy
          persist-credentials: false
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            current/package-lock.json
            legacy/package-lock.json
      - name: Install locked current toolchain
        run: npm ci --ignore-scripts
      - name: Install locked legacy validator dependencies
        working-directory: legacy
        run: npm ci --ignore-scripts
      - name: Run sixteen actual public CLI rollback and owner-death drills
        run: node scripts/drill-storage-public-rollback.mjs --legacy-root=../legacy --output="${{ runner.temp }}/sqlite-public-rollback-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete drill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-public-rollback-${{ matrix.os }}
          path: ${{ runner.temp }}/sqlite-public-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  mcp-resources:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'mcp-resources' }}
    name: Linux paired MCP storage resources
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: current
    steps:
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          persist-credentials: false
      - name: Check out pinned filesystem baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ee9ce11123d4e728d3dbc92f5d62d4bf41bb79c5
          path: legacy
          persist-credentials: false
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: current/package-lock.json
      - name: Install locked current and MCP dependencies
        run: |
          npm ci --ignore-scripts
          npm run mcp:setup
      - name: Install locked baseline dependencies
        working-directory: legacy
        run: npm ci --ignore-scripts
      - name: Compare natural resource lifetime with equal MCP responses
        env:
          MCP_RESOURCE_OUTPUT: ${{ runner.temp }}/sqlite-mcp-resources-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir "$MCP_RESOURCE_OUTPUT"
          git diff --exit-code HEAD
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import path from "node:path";
          const files = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" }).split("\0").filter(Boolean).sort();
          const manifest = files.map(file => ({ path: file, sha256: createHash("sha256").update(readFileSync(file)).digest("hex") }));
          writeFileSync(path.join(process.env.MCP_RESOURCE_OUTPUT, "source-before.json"), JSON.stringify(manifest, null, 2) + "\n", { flag: "wx" });
          NODE
          node scripts/benchmark-storage-mcp.mjs --baseline-root=../legacy --resources=true --task-list-limit=100 --sizes=1000,5000 --repeats=200 --worker-evidence-directory="$MCP_RESOURCE_OUTPUT/workers" --output="$MCP_RESOURCE_OUTPUT/comparison.json" > "$MCP_RESOURCE_OUTPUT/benchmark.log" 2>&1
      - name: Verify tracked source remains unchanged
        if: always()
        env:
          MCP_RESOURCE_OUTPUT: ${{ runner.temp }}/sqlite-mcp-resources-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git diff --exit-code HEAD
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import path from "node:path";
          const files = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" }).split("\0").filter(Boolean).sort();
          const manifest = files.map(file => ({ path: file, sha256: createHash("sha256").update(readFileSync(file)).digest("hex") }));
          const before = JSON.parse(readFileSync(path.join(process.env.MCP_RESOURCE_OUTPUT, "source-before.json"), "utf8"));
          writeFileSync(path.join(process.env.MCP_RESOURCE_OUTPUT, "source-after.json"), JSON.stringify(manifest, null, 2) + "\n", { flag: "wx" });
          assert.deepEqual(manifest, before, "Tracked source changed during resource comparison");
          console.log(`All ${manifest.length} tracked source hashes unchanged`);
          NODE
      - name: Retain aggregate, raw workers and first-cause failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-mcp-resources-Linux
          path: ${{ runner.temp }}/sqlite-mcp-resources-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
