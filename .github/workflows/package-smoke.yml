name: Package smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the release-candidate package and MCP smoke on macOS and Windows
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify package paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.classify.outputs.package }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Classify invocation
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ci-classify.mjs --all --github-output
          else
            node scripts/ci-classify.mjs --github-output
          fi

  tarball-smoke:
    name: tarball smoke (ubuntu-latest)
    needs: classify
    if: ${{ needs.classify.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Install MCP test dependencies
        run: npm run mcp:setup
      - name: Run Ubuntu package and MCP smoke
        run: |
          npm run mcp:test
          npm run mcp:pack:check
          npm run pack:smoke

  release-tarball-smoke:
    name: release package smoke (${{ matrix.os }})
    needs: classify
    if: ${{ inputs.full_matrix == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Install MCP test dependencies
        run: npm run mcp:setup
      - name: Run release package and MCP smoke
        run: |
          npm run mcp:test
          npm run mcp:pack:check
          npm run pack:smoke
