name: Release notes

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build release checksum
        run: |
          npm pack --json > pack.json
          TARBALL="$(node -p "JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))[0].filename")"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "RELEASE_TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "${GITHUB_REF_NAME#v}" = "$actual"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease --latest=false --title "$GITHUB_REF_NAME" "$RELEASE_TARBALL.sha256"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "$RELEASE_TARBALL.sha256"
          fi
