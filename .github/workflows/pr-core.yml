name: PR Core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      repository_index: ${{ steps.classify.outputs.repository_index }}
      package: ${{ steps.classify.outputs.package }}
      audit: ${{ steps.classify.outputs.audit }}
      node_compat: ${{ steps.classify.outputs.node_compat }}
      source: ${{ steps.classify.outputs.source }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ci-classify.mjs --all --github-output
          else
            node scripts/ci-classify.mjs --github-output
          fi

  core:
    name: Unit tests (Node ${{ matrix.node-version }}, shard ${{ matrix.shard }}/4)
    needs: classify
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true') }}
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 24
            shard: 1
          - node-version: 24
            shard: 2
          - node-version: 24
            shard: 3
          - node-version: 24
            shard: 4
          - node-version: "24.19.0"
            shard: 0
    steps:
      - name: Check out repository
        if: ${{ (matrix.node-version == 24 && (needs.classify.outputs.docs_only != 'true' || matrix.shard == 1)) || (matrix.node-version == '24.19.0' && (needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ (matrix.node-version == 24 && (needs.classify.outputs.docs_only != 'true' || matrix.shard == 1)) || (matrix.node-version == '24.19.0' && (needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true')) }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked Node toolchain
        if: ${{ (matrix.node-version == 24 && (needs.classify.outputs.docs_only != 'true' || matrix.shard == 1)) || (matrix.node-version == '24.19.0' && (needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true')) }}
        run: npm ci --ignore-scripts
      - name: Record Linux runner identity
        if: ${{ (matrix.node-version == 24 && (needs.classify.outputs.docs_only != 'true' || matrix.shard == 1)) || (matrix.node-version == '24.19.0' && (needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true')) }}
        run: node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({ platform:process.platform, architecture:process.arch, hostname:os.hostname(), revision:process.env.GITHUB_SHA }));'
      - name: Run the Node 24 unit suite shard with coverage
        if: ${{ matrix.node-version == 24 && (needs.classify.outputs.docs_only != 'true' || matrix.shard == 1) }}
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            npm run test:quick
          else
            export FORGELOOP_TEST_SHARD="${{ matrix.shard }}/4"
            npm run coverage:shard
          fi
      - name: Upload Node 24 coverage shard
        if: ${{ matrix.node-version == 24 && needs.classify.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-data
          if-no-files-found: error
      - name: Run targeted Minimum Node 24.19.0 CLI compatibility
        if: ${{ matrix.node-version == '24.19.0' && (needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true') }}
        run: |
          npm run test:quick
          node src/cli.js --help
          node src/cli.js protocol-info --json
          node --test tests/storage-runtime.test.js tests/storage-store.test.js tests/storage-operational-bootstrap.test.js
      - name: Minimum Node 24.19.0 compatibility not applicable
        if: ${{ matrix.node-version == '24.19.0' && needs.classify.outputs.source != 'true' && needs.classify.outputs.node_compat != 'true' }}
        run: echo "Minimum Node 24.19.0 compatibility is not applicable for this change."
      - name: Node 24 shard not applicable
        if: ${{ matrix.node-version == 24 && needs.classify.outputs.docs_only == 'true' && matrix.shard != 1 }}
        run: echo "Additional Node 24 shards are not applicable for documentation-only changes."

  coverage-report:
    name: Coverage report (Node 24)
    needs: [classify, core]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.classify.outputs.source == 'true') }}
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 15
    steps:
      - name: Check out source changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Download coverage shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Enforce aggregate coverage
        run: |
          npm run coverage:report
          npm run critical-coverage:check

  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Lint and dependency policy
    needs: classify
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 15
    steps:
      - name: Check out source changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Check repository hygiene
        run: npm run repository:hygiene
      - name: Install locked Node toolchain
        if: ${{ needs.classify.outputs.source == 'true' }}
        run: npm ci --ignore-scripts
      - name: Run JavaScript lint
        if: ${{ needs.classify.outputs.source == 'true' }}
        run: npm run lint
      - name: Enforce dependency policy
        if: ${{ needs.classify.outputs.package == 'true' }}
        run: npm run dependency:policy
      - name: Lint and dependency policy not applicable
        if: ${{ needs.classify.outputs.source != 'true' }}
        run: echo "Source lint and dependency policy are not applicable for this change."

  docs-diagram:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Verify generated Archify diagram
    needs: classify
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 30
    steps:
      - name: Check out repository for documentation changes
        if: ${{ needs.classify.outputs.docs == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for documentation changes
        if: ${{ needs.classify.outputs.docs == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install documentation toolchain
        if: ${{ needs.classify.outputs.docs == 'true' }}
        run: npm ci --ignore-scripts
      - name: Validate documentation and diagrams
        if: ${{ needs.classify.outputs.docs == 'true' }}
        run: npm run docs:check
      - name: Lint Markdown
        if: ${{ needs.classify.outputs.docs == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            --no-globs
            **/*.{md,markdown}
            #vendor/archify/**
      - name: Expose the link-check action binary directory
        if: ${{ needs.classify.outputs.docs == 'true' }}
        run: echo "$RUNNER_TEMP/lychee/bin" >> "$GITHUB_PATH"
      - name: Check external documentation links
        if: ${{ needs.classify.outputs.docs == 'true' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml
            --verbose
            --no-progress
            --exclude-path '(^|/)node_modules(/|$)'
            --exclude-path '(^|/)coverage(/|$)'
            --exclude-path '(^|/)\.worktrees(/|$)'
            --exclude-path '(^|/)\.superpowers(/|$)'
            --exclude-path '(^|/)docs/superpowers(/|$)'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate frozen Markdown and loop contracts
        if: ${{ needs.classify.outputs.docs == 'true' }}
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ is required"'
          python3 -m unittest tests.test_validate_markdown tests.test_validate_loop_system -v
          python3 scripts/validate_markdown.py --self-test
          python3 scripts/validate_markdown.py
          python3 scripts/validate_loop_system.py --self-test
          python3 scripts/validate_loop_system.py
      - name: Documentation validation not applicable
        if: ${{ needs.classify.outputs.docs != 'true' }}
        run: echo "Documentation and diagram validation not applicable for this change."

  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: audit
    needs: classify
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 15
    steps:
      - name: Check out repository for audit changes
        if: ${{ needs.classify.outputs.audit == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for audit changes
        if: ${{ needs.classify.outputs.audit == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install locked Node toolchain
        if: ${{ needs.classify.outputs.audit == 'true' }}
        run: npm ci --ignore-scripts
      - name: Audit supplied receipts
        if: ${{ needs.classify.outputs.audit == 'true' }}
        run: node scripts/audit-receipts.mjs
      - name: Receipt audit not applicable
        if: ${{ needs.classify.outputs.audit != 'true' }}
        run: echo "Receipt audit not applicable for this change."

  tarball-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: tarball smoke (ubuntu-latest)
    needs: classify
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 30
    steps:
      - name: Check out repository for package changes
        if: ${{ needs.classify.outputs.package == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for package changes
        if: ${{ needs.classify.outputs.package == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked Node toolchain
        if: ${{ needs.classify.outputs.package == 'true' }}
        run: npm ci --ignore-scripts
      - name: Install MCP test dependencies
        if: ${{ needs.classify.outputs.package == 'true' }}
        run: npm run mcp:setup
      - name: Run Linux package and MCP smoke
        if: ${{ needs.classify.outputs.package == 'true' }}
        run: |
          npm run mcp:test
          npm run mcp:pack:check
          npm run pack:smoke
      - name: Package smoke not applicable
        if: ${{ needs.classify.outputs.package != 'true' }}
        run: echo "Package and MCP smoke not applicable for this change."

  repository-index:
    name: Repository Index native matrix
    needs: [classify, core, coverage-report, lint, docs-diagram, audit, tarball-smoke]
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.repository_index == 'true' }}
    uses: ./.github/workflows/repository-index.yml

  required-validation:
    name: validate (22)
    needs: [classify, core, coverage-report, lint, docs-diagram, audit, tarball-smoke, repository-index]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require applicable validation jobs
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CORE_APPLICABLE: ${{ needs.classify.outputs.source == 'true' || needs.classify.outputs.node_compat == 'true' }}
          REPOSITORY_INDEX_APPLICABLE: ${{ needs.classify.outputs.repository_index }}
          COVERAGE_APPLICABLE: ${{ needs.classify.outputs.source }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.REQUIRED_RESULTS);
          const coreResult = needs.core?.result;
          if (process.env.CORE_APPLICABLE === "true") {
            if (coreResult !== "success") throw new Error(`core did not succeed: ${coreResult ?? "missing"}`);
          } else if (coreResult !== "skipped") {
            throw new Error(`core ran unexpectedly: ${coreResult ?? "missing"}`);
          }
          for (const name of ["classify", "lint", "docs-diagram", "audit", "tarball-smoke"]) {
            if (needs[name]?.result !== "success") {
              throw new Error(`${name} did not succeed: ${needs[name]?.result ?? "missing"}`);
            }
          }
          const coverageResult = needs["coverage-report"]?.result;
          if (process.env.COVERAGE_APPLICABLE === "true") {
            if (coverageResult !== "success") throw new Error(`coverage-report did not succeed: ${coverageResult ?? "missing"}`);
          } else if (coverageResult !== "skipped") {
            throw new Error(`coverage-report ran unexpectedly: ${coverageResult ?? "missing"}`);
          }
          const indexResult = needs["repository-index"]?.result;
          if (process.env.REPOSITORY_INDEX_APPLICABLE === "true") {
            if (indexResult !== "success") throw new Error(`repository-index did not succeed: ${indexResult ?? "missing"}`);
          } else if (indexResult !== "skipped") {
            throw new Error(`repository-index ran unexpectedly: ${indexResult ?? "missing"}`);
          }
          console.log("Required validation passed for all applicable jobs.");
          NODE
