name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH PRIVATE PACKAGE to authorize this manual release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH PRIVATE PACKAGE'
    runs-on: [self-hosted, Linux, X64, forgeloop-linux-remote]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$expected" = "$actual"
      - name: Verify npm version is unpublished
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const registryPath = encodeURIComponent(packageJson.name);
          const response = await fetch(`https://registry.npmjs.org/${registryPath}/${packageJson.version}`);
          if (response.status === 200) {
            throw new Error(`${packageJson.name}@${packageJson.version} already exists on npm`);
          }
          if (response.status !== 404) {
            throw new Error(`Unable to prove ${packageJson.name}@${packageJson.version} is unpublished: HTTP ${response.status}`);
          }
          console.log(`${packageJson.name}@${packageJson.version} is not published`);
          NODE
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            --no-globs
            **/*.{md,markdown}
            #vendor/archify/**
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Enforce repository hygiene
        run: npm run repository:hygiene
      - name: Enforce dependency policy
        run: npm run dependency:policy
      - name: Lint JavaScript
        run: npm run lint
      - name: Measure test coverage
        run: npm run coverage
      - name: Enforce critical-module coverage
        run: npm run critical-coverage:check
      - name: Verify package contents
        run: npm run pack:check
      - name: Inspect package contents
        run: |
          npm pack --dry-run --json > package-dry-run.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const report = JSON.parse(await readFile("package-dry-run.json", "utf8"))[0];
          const paths = report.files.map(({ path }) => path);
          const forbidden = paths.filter((path) =>
            path.startsWith("benchmarks/execution-profiles/results/")
            || path.startsWith("tests/")
            || path.startsWith("coverage/")
            || path.startsWith(".git/")
            || path.startsWith(".forgeloop/task-state/")
            || path.startsWith(".forgeloop/")
            || path.endsWith(".tgz")
            || (path.startsWith(".github/") && path !== ".github/copilot-instructions.md"));
          if (forbidden.length > 0) {
            throw new Error(`Forbidden package paths: ${forbidden.join(", ")}`);
          }
          for (const required of [
            "src/cli.js",
            "src/config/guides.json",
            "schemas/work-state.schema.json",
            "benchmarks/execution-profiles/documentation-correction.json",
          ]) {
            if (!paths.includes(required)) throw new Error(`Missing required package path: ${required}`);
          }
          console.log(`Inspected ${paths.length} package files (${report.size} bytes packed)`);
          NODE
      - name: Smoke-test packed package
        run: npm run pack:smoke
      - name: Verify documentation conformance
        run: npm run docs:check
      - name: Run repository validators
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ is required"'
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_markdown.py --self-test
          python3 scripts/validate_markdown.py
          python3 scripts/validate_loop_system.py --self-test
          python3 scripts/validate_loop_system.py
          python3 scripts/scan_secrets.py

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH PRIVATE PACKAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$expected" = "$actual"
      - name: Verify npm version is unpublished
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const registryPath = encodeURIComponent(packageJson.name);
          const response = await fetch(`https://registry.npmjs.org/${registryPath}/${packageJson.version}`);
          if (response.status === 200) {
            throw new Error(`${packageJson.name}@${packageJson.version} already exists on npm`);
          }
          if (response.status !== 404) {
            throw new Error(`Unable to prove ${packageJson.name}@${packageJson.version} is unpublished: HTTP ${response.status}`);
          }
          console.log(`${packageJson.name}@${packageJson.version} is not published`);
          NODE
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Publish with trusted publishing
        run: npm publish --provenance --access restricted
