name: Node compatibility

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expanded:
        description: Run the cross-platform Node compatibility smoke matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: node-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum:
    name: Node 20 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Run targeted compatibility smoke
        run: |
          npm run test:quick
          node src/cli.js --help
          node src/cli.js protocol-info --json

  expanded:
    name: Node compatibility (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: ${{ inputs.expanded == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: 20 }
          - { os: ubuntu-latest, node-version: 22 }
          - { os: macos-latest, node-version: 20 }
          - { os: macos-latest, node-version: 24 }
          - { os: windows-latest, node-version: 20 }
          - { os: windows-latest, node-version: 24 }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Run targeted compatibility smoke
        run: |
          npm run test:quick
          node src/cli.js --help
          node src/cli.js protocol-info --json
