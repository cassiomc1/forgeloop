<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
<title id="title">ForgeLoop architecture</title>
<desc id="description">A coding host connects through ForgeLoop entry points to deterministic project and task governance. ForgeLoop records task state in SQLite mode, consumes host-executed checks as evidence, and validates closure. Jev is a bounded semantic input and has no lifecycle authority. Legacy operational state requires explicit migration; portable exports remain interchange.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#101c31"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f8eae"/></marker>
  <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5eead4"/></marker>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e5eef9}
    .kicker{font-size:15px;font-weight:700;letter-spacing:2.4px;fill:#7dd3fc}
    .title{font-size:42px;font-weight:750;letter-spacing:-1px}
    .subtitle{font-size:18px;fill:#9db0c8}
    .section{font-size:14px;font-weight:700;letter-spacing:1.8px;fill:#8ca3bd}
    .label{font-size:18px;font-weight:700}
    .body{font-size:14px;fill:#aebed1}
    .small{font-size:13px;fill:#9db0c8}
    .tiny{font-size:12px;fill:#8da2ba}
    .box{fill:#14243a;stroke:#2a405a;stroke-width:1.5}
    .core{fill:#112a3c;stroke:#2dd4bf;stroke-width:1.8}
    .store{fill:#182541;stroke:#818cf8;stroke-width:1.8}
    .external{fill:#172237;stroke:#506985;stroke-width:1.4}
    .line{fill:none;stroke:#6f8eae;stroke-width:2;marker-end:url(#arrow)}
    .dashed{fill:none;stroke:#a78bfa;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    .mint{fill:none;stroke:#5eead4;stroke-width:2;marker-end:url(#arrowMint)}
  </style>
</defs>
<rect width="1600" height="980" rx="28" fill="url(#bg)"/>
<path d="M60 180H1540" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
<text x="80" y="62" class="kicker">EVIDENCE-FIRST ENGINEERING GOVERNANCE</text>
<text x="80" y="112" class="title">ForgeLoop architecture</text>
<text x="80" y="155" class="subtitle">A deterministic protocol between the coding host, project, and verified outcome</text>

<text x="80" y="210" class="section">HOST AND PROJECT CONTEXT</text>
<g filter="url(#shadow)">
  <rect x="80" y="230" width="290" height="118" rx="18" class="external"/>
  <rect x="440" y="230" width="340" height="118" rx="18" class="box"/>
  <rect x="850" y="230" width="650" height="118" rx="18" class="box"/>
</g>
<text x="110" y="272" class="label">Developer request</text><text x="110" y="302" class="body">Intent, constraints, and repository</text>
<path d="M370 289H432" class="line"/>
<text x="470" y="272" class="label">AI coding host / harness</text><text x="470" y="302" class="body">Understands the task and performs the implementation</text>
<path d="M780 289H842" class="line"/>
<text x="882" y="272" class="label">Portable project instructions</text><text x="882" y="302" class="body">Native shims → LOOP_ENGINEERING → GUIDE_ROUTER → selected ENG guides</text>

<text x="80" y="406" class="section">FORGELOOP CONTROL PLANE</text>
<g filter="url(#shadow)">
  <rect x="80" y="432" width="250" height="142" rx="18" class="core"/>
  <rect x="370" y="432" width="250" height="142" rx="18" class="core"/>
  <rect x="660" y="432" width="250" height="142" rx="18" class="core"/>
  <rect x="950" y="432" width="250" height="142" rx="18" class="core"/>
  <rect x="1240" y="432" width="260" height="142" rx="18" class="core"/>
</g>
<text x="110" y="475" class="label">CLI + Integration API</text><text x="110" y="505" class="body">Stable host boundary</text><text x="110" y="529" class="body">and command provenance</text>
<path d="M330 503H362" class="line"/>
<text x="400" y="475" class="label">Discover + scope</text><text x="400" y="505" class="body">Project evidence</text><text x="400" y="529" class="body">Claims + task contract</text>
<path d="M620 503H652" class="line"/>
<text x="690" y="475" class="label">Route + preflight</text><text x="690" y="505" class="body">Guides, policy, gates</text><text x="690" y="529" class="body">PREFLIGHT_READY</text>
<path d="M910 503H942" class="line"/>
<text x="980" y="475" class="label">Execute + verify</text><text x="980" y="505" class="body">Host runs checks</text><text x="980" y="529" class="body">ForgeLoop records results</text>
<path d="M1200 503H1232" class="line"/>
<text x="1270" y="475" class="label">Review + validate</text><text x="1270" y="505" class="body">Completion validator</text><text x="1270" y="529" class="body">VALID or non-valid</text>

<text x="80" y="612" class="section">STATE, EVIDENCE, AND EXTERNAL INPUTS</text>
<g filter="url(#shadow)">
  <rect x="80" y="662" width="570" height="196" rx="18" class="store"/>
  <rect x="720" y="662" width="340" height="196" rx="18" class="external"/>
  <rect x="1130" y="662" width="370" height="196" rx="18" class="external"/>
</g>
<text x="112" y="704" class="label">SQLite-backed operational storage</text>
<text x="112" y="736" class="body">.forgeloop/state.sqlite — selected SQLite mode</text>
<text x="112" y="766" class="body">Task records · claims · event history · artifacts</text>
<text x="112" y="796" class="small">Legacy filesystem mode remains a separate compatibility path.</text>
<text x="112" y="825" class="tiny">Canonical operational writer: SQLite. Portable exports are interchange.</text>
<path d="M785 574V634H365V654" class="mint"/>
<text x="720" y="704" class="label">Host tools</text>
<text x="752" y="738" class="body">Tests · builds · platform checks</text>
<text x="752" y="768" class="body">Return observed results to evidence</text>
<text x="752" y="812" class="small">The host, not ForgeLoop, implements code.</text>
<path d="M712 758H658" class="mint"/>
<text x="1162" y="704" class="label">Jev semantic input</text>
<text x="1162" y="738" class="body">Bounded typed judgment at required</text>
<text x="1162" y="768" class="body">semantic checkpoints</text>
<text x="1162" y="812" class="small">Advisory to the protocol; never lifecycle authority.</text>
<path d="M1240 662V622H785V582" class="dashed"/>

<rect x="80" y="878" width="1420" height="58" rx="16" fill="#0b1728" stroke="#263c56"/>
<circle cx="110" cy="907" r="7" fill="#5eead4"/><text x="132" y="913" class="body">ForgeLoop owns state transitions, claims, gates, evidence binding, and completion validation.</text>
<text x="1070" y="913" class="small">Read-only advisory context stays outside authority.</text>
</svg>
